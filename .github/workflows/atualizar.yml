name: Atualizar preços e publicar

on:
  schedule:
    - cron: '0 9 * * 3' # quartas, 06h de Brasília: catálogos dos sites + encartes
    - cron: '0 9 * * 0,1,2,4,5,6' # demais dias, 06h: só encartes (Assaí e Baronesa trocam no meio da semana)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'server/build-site.mjs', 'server/readers/**', 'server/collectors/baronesa.mjs', 'server/collectors/assai.mjs', '.github/workflows/atualizar.yml']

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            app/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --prefix server
          npm ci --prefix app

      - name: Restaurar cache de leitura dos encartes
        uses: actions/cache@v4
        with:
          path: server/data/cache
          key: encartes-${{ github.run_id }}
          restore-keys: encartes-

      - name: Coletar catálogos dos sites
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 3'
        working-directory: server
        run: node run-all.mjs

      - name: Ler encartes (Assaí e Baronesa)
        working-directory: server
        continue-on-error: true
        timeout-minutes: 30
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Worker na Cloudflare (pasta worker-imagens/): só repassa imagens do servidor de encartes do Assaí,
          # que recusa os IPs do GitHub. Usado só quando o download direto dá 403.
          IMG_PROXY: https://monitoramento-precos-imagens.consultor-milhas-worker.workers.dev
        run: |
          node collectors/assai.mjs || echo "::warning::Assaí: lista de encartes indisponível"
          node collectors/baronesa.mjs || echo "::warning::Baronesa: encarte indisponível"
          node readers/folheto.mjs data/extraido/assai-encartes.json data/extraido/baronesa-encartes.json

      - name: Guardar dados coletados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/extraido
          git diff --cached --quiet || (git commit -m "Atualiza dados de preços" && git pull --rebase -X theirs && git push)

      - name: Testar o agrupamento de produtos
        working-directory: server
        run: npm test

      - name: Montar dados e imagens do site
        working-directory: server
        run: node build-site.mjs

      - name: Compilar o site
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Publicar na branch gh-pages (um único commit, sem acumular histórico)
        working-directory: app/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site de ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
