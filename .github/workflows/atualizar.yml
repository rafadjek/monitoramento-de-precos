name: Atualizar preços e publicar

on:
  schedule:
    - cron: '0 9 * * 3' # quartas, 06h no horário de Brasília (os folhetos trocam nesse dia)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'server/build-site.mjs', '.github/workflows/atualizar.yml']

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            app/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --prefix server
          npm ci --prefix app

      - name: Coletar catálogos dos sites
        if: github.event_name != 'push'
        working-directory: server
        run: node run-all.mjs

      - name: Guardar dados coletados
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/extraido
          git diff --cached --quiet || (git commit -m "Atualiza dados de preços" && git pull --rebase -X theirs && git push)

      - name: Montar dados e imagens do site
        working-directory: server
        run: node build-site.mjs

      - name: Compilar o site
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Publicar na branch gh-pages (um único commit, sem acumular histórico)
        working-directory: app/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site de ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
