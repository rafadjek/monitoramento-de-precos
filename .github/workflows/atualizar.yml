name: Atualizar preços e publicar

on:
  schedule:
    # todo dia, 06h de Brasília: catálogos dos sites + encartes (as ofertas mudam de um dia para o outro)
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'server/build-site.mjs', 'server/readers/**', 'server/collectors/baronesa.mjs', 'server/collectors/assai.mjs', 'server/collectors/joanin.mjs', 'server/collectors/roldao.mjs', 'server/collectors/dia.mjs', 'server/collectors/social.mjs', 'server/judge.mjs', 'server/group.mjs', 'server/data/rotulos/rotulos.json', '.github/workflows/atualizar.yml']

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            app/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci --prefix server
          npm ci --prefix app

      - name: Restaurar cache de leitura dos encartes
        uses: actions/cache@v4
        with:
          path: server/data/cache
          key: encartes-${{ github.run_id }}
          restore-keys: encartes-

      - name: Coletar catálogos dos sites
        if: github.event_name != 'push'
        working-directory: server
        env:
          COLLECTORS: spani,atacadao,coop,nagumo,semar,extra
        run: node run-all.mjs

      - name: Ler encartes (Assaí, Baronesa, Joanin e Roldão)
        working-directory: server
        continue-on-error: true
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Apify (crédito grátis): jornais de ofertas do Instagram e do Facebook de Nevada, STUK e Lourencini
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # reservas, nesta ordem, se a Apify falhar ou o crédito acabar
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          SCRAPECREATORS_KEY: ${{ secrets.SCRAPECREATORS_KEY }}
          SOCIALCRAWL_KEY: ${{ secrets.SOCIAL_CRAW_API || secrets.SOCIALCRAWL_KEY || secrets.SOCIALCRAWL_API_KEY || secrets.SOCIALCRAWL_TOKEN || secrets.SOCIALCRAWL }}
          CRAWLBASE_TOKEN: ${{ secrets.CRAWLBASE_API }}
          SOCIAL_TEST: socialcrawl # diagnóstico à parte da reserva SocialCrawl (não muda o resultado)
          # Worker na Cloudflare (pasta worker-imagens/): só repassa imagens do servidor de encartes do Assaí,
          # que recusa os IPs do GitHub. Usado só quando o download direto dá 403.
          IMG_PROXY: https://monitoramento-precos-imagens.consultor-milhas-worker.workers.dev
        run: |
          node collectors/assai.mjs || echo "::warning::Assaí: lista de encartes indisponível"
          node collectors/baronesa.mjs || echo "::warning::Baronesa: encarte indisponível"
          node collectors/joanin.mjs || echo "::warning::Joanin: tabloide indisponível"
          node collectors/roldao.mjs || echo "::warning::Roldão: encarte indisponível"
          node collectors/dia.mjs || echo "::warning::Dia: folheto indisponível no Tiendeo"
          node collectors/social.mjs || echo "::warning::Instagram (Apify) indisponível"
          node readers/folheto.mjs data/extraido/assai-encartes.json data/extraido/baronesa-encartes.json data/extraido/joanin-encartes.json data/extraido/roldao-encartes.json data/extraido/social-encartes.json

      # Juiz de "mesmo produto?" (Gemini grátis): primeiro a prova com os pares rotulados pelo Rafael;
      # se acertar >= 95% e mais que a regra, julga pares duvidosos (cada par uma vez só, com teto por rodada).
      - name: Juiz de produtos iguais
        working-directory: server
        continue-on-error: true
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node judge.mjs

      - name: Guardar dados coletados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/extraido
          git diff --cached --quiet || (git commit -m "Atualiza dados de preços" && git pull --rebase -X theirs && git push)

      - name: Testar o agrupamento de produtos
        working-directory: server
        run: npm test

      - name: Testar a conta do Carrinho Inteligente
        working-directory: app
        run: npm test

      - name: Montar dados e imagens do site
        working-directory: server
        run: node build-site.mjs

      # Endereço oficial: https://bate-ofertas.pages.dev (Cloudflare Pages, projeto bate-ofertas).
      # Com a chave do Cloudflare, publica lá e o endereço antigo do GitHub Pages vira só um redirecionamento.
      # Sem a chave, continua publicando o site completo no GitHub Pages (nada fica parado).
      - name: Compilar e publicar o site
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eabf66b4fd617d6adc78c3aa603100be
          OLD_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            VITE_BASE=/ npm run build
            npx --yes wrangler@4 pages deploy dist --project-name bate-ofertas --branch main --commit-dirty=true
            # GitHub Pages: só redireciona para o endereço novo (mantém a busca e a lista do link)
            rm -rf gh && mkdir gh
            printf '%s' '<!doctype html><meta charset="utf-8"><title>Bate Ofertas</title><meta name="robots" content="noindex"><script>location.replace("https://bate-ofertas.pages.dev/"+location.search+location.hash)</script><p>O Bate Ofertas mudou para <a href="https://bate-ofertas.pages.dev/">bate-ofertas.pages.dev</a>.</p>' > gh/index.html
            cp gh/index.html gh/404.html
          else
            VITE_BASE="$OLD_BASE" npm run build
            rm -rf gh && cp -r dist gh
          fi

      - name: Publicar na branch gh-pages (um único commit, sem acumular histórico)
        working-directory: app/gh
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site de ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
