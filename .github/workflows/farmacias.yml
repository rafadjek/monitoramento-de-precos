name: Coletar farmácias e açougue

# Fase 14: as farmácias têm dezenas de milhares de itens e não cabem no tempo da coleta principal
# (atualizar.yml já leva ~3 h). Este workflow só coleta e grava os JSON em server/data/extraido;
# a publicação diária normal (atualizar.yml) é que leva esses preços ao site.
on:
  schedule:
    # todo dia, 22h47 de Brasília: termina antes da coleta principal das 01h17
    - cron: '47 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farmacias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix server

      - name: Coletar farmácias e açougue
        working-directory: server
        env:
          COLLECTORS: drogariasaopaulo,farmaconde,tonybrj
        run: node run-all.mjs

      - name: Guardar dados coletados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data/extraido
          git diff --cached --quiet || (git commit -m "Atualiza preços das farmácias [skip ci]" && git pull --rebase -X theirs && git push)
